<!DOCTYPE html>
<html>
<head>
    <title>The Seven Seas of Thieves</title>

    <style>

        body {
            background-color: rgb(255, 1, 1);
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: rgb(0, 0, 0);
        }

        p {
            font-size: 18px;
        }

        .box {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            border: 3px solid black;
            padding: 10px;
        }

        .complementary {
            background-color: blue;
            color: orange;
        }

        .analogous {
            background-color: green;
            color: yellow;
            border-color: yellowgreen;
        }

        .triadic {
            background-color: rgb(244, 6, 172);
            color: yellow;
            border-color: blue;
        }

    </style>
</head>

<body>

    <h1>The Seven Seas of Thieves</h1>

    <p>Welcome to my pirate website! I like pirates because
    they sailed ships, searched for treasure, and explored the ocean.</p>

    <h2>Color Theory</h2>

    <div class="box complementary">
        <h2>Complementary Colors</h2>
        <p>Blue and Orange</p>
    </div>

    <div class="box analogous">
        <h2>Analogous Colors</h2>
        <p>Green, Yellow-Green, and Yellow</p>
    </div>

    <div class="box triadic">
        <h2>Triadic Colors</h2>
        <p>Pink, Blue, and Yellow</p>
    </div>

</body>
</html>
